name: CI/CD

# Tests en cada push/PR a main. Despliegue SOLO en push a main y SOLO si los tests pasan.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un despliegue a la vez. No cancelamos uno en curso a medias (dejaria el server a medias).
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

# El token de Actions solo necesita leer el repo.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # TESTS — runner de GitHub (aislado, sin acceso al servidor). Corre en push y PR.
  # PHP 8.2 = misma version que produccion (el contenedor es php:8.2-apache).
  # Solo PHPUnit: los de integracion (Python) necesitan el stack y tocan APIs
  # reales (Zoho incluido), asi que NO son puerta de CI.
  # ---------------------------------------------------------------------------
  test:
    name: Tests y calidad
    runs-on: ubuntu-latest
    # PHP 8.2 desde la imagen oficial en vez de shivammathur/setup-php: la org tiene
    # restringidas las acciones a actions/* y de GitHub, asi que una accion de
    # terceros esta bloqueada. Con `container:` no hace falta ninguna accion externa
    # (solo actions/checkout, que si esta permitida) y ademas fijamos exactamente la
    # misma version que produccion (el contenedor de deploy es php:8.2-apache).
    container:
      image: php:8.2-cli
    steps:
      - uses: actions/checkout@v4

      - name: Preparar PHP (extensiones y Composer)
        run: |
          set -euo pipefail
          # git y unzip los necesita Composer para instalar/extraer los paquetes.
          apt-get update
          apt-get install -y --no-install-recommends git unzip
          # Mismas extensiones que produccion que hacen falta aqui (mysqlnd va incluido,
          # no precisa libs de sistema). gd no lo usan ni los tests ni PHPStan.
          docker-php-ext-install mysqli pdo_mysql
          # Composer via el propio PHP (sin curl): la imagen -cli no trae el binario.
          php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
          php composer-setup.php --install-dir=/usr/local/bin --filename=composer
          php -r "unlink('composer-setup.php');"

      - name: Instalar dependencias
        run: composer install --no-interaction --no-progress --prefer-dist

      # ISO A.8.8: falla el build si alguna dependencia tiene un CVE conocido.
      - name: Auditoria de dependencias
        run: composer audit --no-interaction

      # ISO A.8.28: analisis estatico. INFORMATIVO de momento (no rompe el build)
      # hasta generar el baseline; ver phpstan.neon.dist para gatearlo del todo.
      - name: Analisis estatico (PHPStan)
        continue-on-error: true
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

      - name: Ejecutar PHPUnit
        run: vendor/bin/phpunit --configuration phpunit.xml

  # ---------------------------------------------------------------------------
  # SECRETOS — gitleaks escanea el arbol en cada push/PR. Si encuentra una
  # credencial, el CI sale en rojo. ISO 27001:2022 A.8.24. Es la red que evita
  # que se vuelva a colar un secreto como paso antes.
  # ---------------------------------------------------------------------------
  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar gitleaks
        run: |
          set -euo pipefail
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Escanear
        run: gitleaks detect --no-git --redact -v --config .gitleaks.toml

  # ---------------------------------------------------------------------------
  # DEPLOY — tu runner self-hosted (en el VPS). SOLO push a main y SOLO si test
  # ha pasado (needs: test). Nunca en pull_request. Hay un unico runner
  # self-hosted en la org, asi que basta 'self-hosted' (sin etiqueta extra).
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy (self-hosted)
    needs: [test, secrets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Backup de la BD antes de desplegar
        run: |
          set -euo pipefail
          cd /home/galagaagency/proyectos/energia_solar_canarias
          mkdir -p backups
          DBPASS=$(python3 -c "import json;print(json.load(open('backend-config/conexion.json'))[0]['password'])")
          docker exec -e MYSQL_PWD="$DBPASS" mysql \
            mysqldump -uescuser --single-transaction --routines --no-tablespaces esc \
            | gzip > "backups/esc_ci_$(date +%F_%H%M%S).sql.gz"

      - name: Traer EXACTAMENTE el commit probado al contexto de build
        run: |
          set -euo pipefail
          cd /home/galagaagency/proyectos/energia_solar_canarias/energia_solar_canarias_backend
          git fetch --prune origin main
          # reset --hard: el server es un destino de despliegue, no un dir de trabajo.
          # Despliega el mismo commit que pasaron los tests (github.sha).
          git reset --hard "${{ github.sha }}"

      - name: Reconstruir y levantar solo esc_backend
        run: |
          set -euo pipefail
          cd /home/galagaagency/proyectos
          # --build porque el codigo va DENTRO de la imagen. Al arrancar, el
          # entrypoint aplica las migraciones antes de levantar Apache.
          docker compose up -d --build esc_backend

      - name: Comprobacion de humo (si falla, el deploy sale en rojo)
        run: |
          set -euo pipefail
          # 1) el contenedor tiene que estar 'running', no en Restarting (migracion rota)
          test "$(docker inspect -f '{{.State.Status}}' esc_backend)" = "running"
          # 2) Apache/PHP tiene que estar SIRVIENDO por HTTP. Auto-detectamos el
          #    puerto publicado (no lo fijamos a mano) y aceptamos CUALQUIER codigo
          #    HTTP: 200/404/403 significan que el server responde. Solo falla si no
          #    contesta nada (000 = contenedor caido o no escucha).
          PORT=$(docker port esc_backend 2>/dev/null | grep -oE '0\.0\.0\.0:[0-9]+' | head -1 | cut -d: -f2 || true)
          if [ -n "${PORT:-}" ]; then
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 15 "http://localhost:$PORT/" || echo 000)
            echo "HTTP en localhost:$PORT -> $code"
            test "$code" != "000"
          else
            echo "esc_backend no publica puerto al host; me quedo con el estado del contenedor"
          fi
          # 3) Zoho tiene que llegar a $_ENV (el fix EGPCS)
          docker exec esc_backend php -r 'exit(isset($_ENV["ZOHO_REFRESH_TOKEN"]) ? 0 : 1);'
