# Config de gitleaks (escaneo de secretos en CI).
# Cubre ISO 27001:2022 A.8.24 — evita que se vuelva a colar una credencial.
# Parte de las reglas por defecto y anade una allowlist de falsos positivos conocidos.

[extend]
useDefault = true

[allowlist]
description = "Falsos positivos conocidos de este repo"

# Rutas que no son codigo fuente o son ruido (binarios, dependencias, doc).
paths = [
  '''vendor/.*''',
  '''composer\.lock''',
  '''storage/esc\.apk''',
  '''storage/img_screens_.*''',
]

# Valores que NO son secretos aunque lo parezcan:
regexes = [
  # Ejemplo literal de la interfaz; es un placeholder, no una credencial utilizable.
  '''tu_token_de_acceso''',
  # Marcadores de las plantillas (bruno/environments/EU.example.bru): TU_API_KEY_..., etc.
  '''^TU_[A-Z0-9_]+$''',
  # Marcador dejado por la purga del historial.
  '''\*\*\*REMOVED\*\*\*''',
]
