# CORS para DESARROLLO. Solo lo carga el contenedor local.
#
# Produccion NO usa este fichero: despliega con `git pull` a /var/www/html/esc-backend
# (ver webhookgithub.php) y sus cabeceras CORS las pone el vhost del VPS, que no esta
# en el repo y solo permite https://app.energiasolarcanarias.com. Aqui se replica ese
# mismo esquema apuntando al Next de desarrollo.
#
# Este fichero solo tiene efecto porque docker-compose.yml lo monta en
# conf-enabled/. Si llega a produccion por el git pull, queda ahi como un fichero
# suelto que Apache no incluye: es inerte.
#
# Se listan origenes concretos a proposito. Con "*" no valdria: el navegador prohibe
# combinar Allow-Origin: * con Allow-Credentials: true.

<IfModule mod_headers.c>
    SetEnvIf Origin "^http://(localhost|127\.0\.0\.1):(3000|3001)$" CORS_ORIGIN=$0

    Header always set Access-Control-Allow-Origin %{CORS_ORIGIN}e env=CORS_ORIGIN
    Header always set Access-Control-Allow-Credentials "true" env=CORS_ORIGIN
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" env=CORS_ORIGIN
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, usuario, apikey" env=CORS_ORIGIN

    # Si el origen cambia, la respuesta cacheada no vale: sin esto un proxy podria
    # servirle a un origen la cabecera calculada para otro.
    Header always append Vary "Origin" env=CORS_ORIGIN
</IfModule>
